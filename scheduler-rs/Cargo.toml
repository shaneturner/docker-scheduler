[package]
name = "scheduler-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] } # Use "full" for simplicity now

# Docker API client
bollard = "0.16"

# Cron scheduling
tokio-cron-scheduler = "0.10"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration (dotenv + env vars)
dotenvy = "0.15" # For .env file loading

# Error Handling
anyhow = "1.0"   # For application-level error handling (simpler ?)
thiserror = "1.0" # For defining custom library-level errors

# Time and Timezones
chrono = { version = "0.4", features = ["serde"] } # Base time library
chrono-tz = "0.9"  # Timezone support

# Command splitting (like Python's shlex)
shlex = "1.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v5", "serde"] }
